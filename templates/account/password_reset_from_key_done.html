{% extends "account/auth_base.html" %}
{% load i18n %}

{% block auth_head_title %}Mot de passe mis à jour{% endblock %}

{% block auth_body %}
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-emerald-100 text-2xl" aria-hidden="true">✓</div>
<h1 class="mt-4 text-2xl font-black tracking-tight text-slate-900">Mot de passe modifié</h1>
<p class="mt-2 text-sm text-slate-600">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
<p class="mt-6">
    <a
        href="{% url 'account_login' %}"
        class="inline-flex w-full items-center justify-center rounded-xl bg-gradient-to-r from-orange-500 to-orange-600 px-4 py-3.5 text-sm font-semibold text-white shadow-lg shadow-orange-500/25 hover:from-orange-600 hover:to-orange-700 sm:w-auto sm:px-8"
    >
        Se connecter
    </a>
</p>
{% endblock %}
