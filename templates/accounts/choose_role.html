{% extends "account/auth_base.html" %}
{% block auth_head_title %}Choisir un profil{% endblock %}
{% block auth_body %}
<div class="flex items-start gap-3">
    <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-slate-800 text-lg font-black text-white">?</div>
    <div>
        <h1 class="text-2xl font-black tracking-tight text-slate-900">Quel profil vous correspond ?</h1>
        <p class="mt-1 text-sm text-slate-600">Vous pourrez ajuster plus tard avec l’équipe si besoin.</p>
    </div>
</div>
<form method="post" class="mt-8 grid gap-3">
    {% csrf_token %}
    <button
        type="submit"
        name="role"
        value="CUSTOMER"
        class="group rounded-xl border-2 border-slate-200 bg-white p-4 text-left transition hover:border-peach-text hover:bg-peach focus:outline-none focus:ring-2 focus:ring-peach-text"
    >
        <span class="font-semibold text-slate-900">Client</span>
        <span class="mt-1 block text-sm text-slate-600">Parcourir le catalogue, favoris, avis, contact WhatsApp</span>
    </button>
    <button
        type="submit"
        name="role"
        value="SELLER"
        class="group rounded-xl border-2 border-slate-200 bg-white p-4 text-left transition hover:border-peach-text hover:bg-peach focus:outline-none focus:ring-2 focus:ring-peach-text"
    >
        <span class="font-semibold text-slate-900">Vendeur</span>
        <span class="mt-1 block text-sm text-slate-600">Créer et gérer ma boutique (validation admin)</span>
    </button>
</form>
{% endblock %}
